name: Publish package repositories

# Rebuilds Kumiko's APT and RPM repositories from its published GitHub
# releases, signs them, and deploys them to GitHub Pages
# (https://iqzer0.github.io/kumiko-packages/).
#
# Stateless: nothing is stored in this repo but this workflow and the
# maintainer keys. Every run rebuilds the whole repository from the releases,
# so a run cannot lose packages and a failed run is repaired by the next one.
# The build scripts come from iqzer0/kumiko (packaging/repo), where they are
# reviewed and tested.

on:
  schedule:
    - cron: '17 */6 * * *'     # every 6 hours: a new release appears within hours
  workflow_dispatch:             # or right away: Actions -> this workflow -> Run workflow

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    # https://github.com/actions/checkout/tags
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        repository: iqzer0/kumiko
        path: kumiko
        sparse-checkout: packaging/repo

    - name: Install tools
      run: sudo apt-get update -qq && sudo apt-get install -yq --no-install-recommends apt-utils createrepo-c rpm gnupg

    - name: Download release packages
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        keys=
        if [ -s maintainers.asc ]; then
          keys=maintainers.asc
        else
          echo "::warning::maintainers.asc is missing: release signatures are not being checked"
        fi
        sh kumiko/packaging/repo/fetch-releases.sh iqzer0/kumiko packages $keys

    - name: Build and sign the repositories
      env:
        REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
      run: |
        if [ -z "$REPO_SIGNING_KEY" ]; then
          echo "::error::the REPO_SIGNING_KEY secret is not set (see README)"
          exit 1
        fi
        export GNUPGHOME=$(mktemp -d)
        printf '%s\n' "$REPO_SIGNING_KEY" | gpg --batch --quiet --import
        export KUMIKO_REPO_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
        sh kumiko/packaging/repo/build-repo.sh packages site
        rm -rf "$GNUPGHOME"

    # https://github.com/actions/configure-pages/tags
    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    # https://github.com/actions/upload-pages-artifact/tags
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    # https://github.com/actions/deploy-pages/tags
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
